[package]
name = "redirect-links"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
actix-web = "=4.15.0"
diesel = { version = "=2.3.13", default-features = false, features = ["postgres", "r2d2", "chrono", "32-column-tables"] }
r2d2 = "=0.8.10"
tokio = { version = "=1.53.1", features = ["sync", "time"] }
chrono = { version = "=0.4.45", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
url = "=2.5.8"
subtle = "=2.6.1"
