quarkus.http.host=127.0.0.1
quarkus.http.port=8080
quarkus.http.limits.max-body-size=64K
quarkus.datasource.db-kind=postgresql
quarkus.datasource.db-version=18.0
quarkus.datasource.username=${PGUSER:revision_app}
quarkus.datasource.password=${PGPASSWORD:preflight-placeholder}
quarkus.datasource.jdbc.url=${JDBC_URL:jdbc:postgresql://unallocated.invalid:5432/postgres}
quarkus.datasource.jdbc.additional-jdbc-properties.sslmode=verify-full
quarkus.datasource.jdbc.additional-jdbc-properties.sslrootcert=${PGSSLROOTCERT:/nonexistent-preflight.pem}
quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=5
quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=15
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.max-size=4
quarkus.datasource.jdbc.acquisition-timeout=3S
quarkus.datasource.devservices.enabled=false
quarkus.devservices.enabled=false
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.hibernate-orm.log.sql=false
quarkus.flyway.migrate-at-start=false
quarkus.flyway.validate-at-start=false
quarkus.flyway.clean-disabled=true
quarkus.flyway.schemas=revision_api
accounts.first-token=${ACCOUNT_001_TOKEN}
accounts.second-token=${ACCOUNT_002_TOKEN}
