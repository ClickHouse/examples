server.address=${APP_BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE:postgres}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.data-source-properties.sslmode=verify-full
spring.datasource.hikari.data-source-properties.sslrootcert=${PGSSLROOTCERT}
spring.datasource.hikari.data-source-properties.currentSchema=expenses
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=expenses
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.flyway.enabled=false
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
