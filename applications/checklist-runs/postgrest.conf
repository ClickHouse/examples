# libpq reads PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD,
# PGSSLMODE=verify-full and PGSSLROOTCERT from the runtime environment.
db-uri = "postgresql://"
db-schemas = "checklist_api"
db-extra-search-path = ""
db-config = false
db-pre-request = "checklist_storage.check_request"
db-max-rows = 20
db-pool = 4
db-pool-acquisition-timeout = 5
db-pool-max-lifetime = 900
db-pool-max-idletime = 30
db-pool-automatic-recovery = false
db-tx-end = "commit"
jwt-aud = "checklist-runs"
jwt-role-claim-key = "$$.role"
# PGRST_JWT_SECRET is set privately at runtime. No anonymous role.
server-cors-allowed-origins = "http://127.0.0.1:5173,http://localhost:5173"
server-host = "127.0.0.1"
server-port = 3000
server-trace-header = ""
openapi-mode = "disabled"
log-level = "warn"
