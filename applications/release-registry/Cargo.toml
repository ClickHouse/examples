[package]
name = "release-registry"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
axum = "=0.8.9"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.26.1", features = ["serde"] }
chrono = { version = "=0.4.45", features = ["serde"] }
sha2 = "=0.11.0"
subtle = "=2.6.1"

[dev-dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
