# Identical tuning applied to every Postgres instance in the lab (appended to postgresql.conf / passed as -c flags)
shared_buffers = 1GB
work_mem = 64MB
max_parallel_workers_per_gather = 4
# deviations from "defaults" applied equally to all instances, to keep the 50M-row load reasonable:
max_wal_size = 4GB
maintenance_work_mem = 512MB
max_connections = 100
