services:
  clickhouse:
    build:
      context: ./docker_files
      dockerfile: clickhouse-odbc.Dockerfile
      args:
        CHVER: ${CHVER:-latest}
    environment:
      CLICKHOUSE_USER: demo
      CLICKHOUSE_PASSWORD: local-example-password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./fs/volumes/clickhouse/odbc/odbc.ini:/etc/odbc.ini:ro
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "127.0.0.1:18123:8123"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "demo", "--password", "local-example-password", "--query", "SELECT 1"]
      interval: 2s
      timeout: 5s
      retries: 30

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
    platform: linux/amd64
    environment:
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Mssql_Password123
      ACCEPT_EULA: "Y"
    volumes:
      - ./fs/volumes/create-dataset:/fixtures:ro
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -l 5 -t 5 -Q 'SELECT 1' -o /dev/null"]
      interval: 5s
      timeout: 10s
      start_period: 20s
      retries: 30

volumes:
  clickhouse-data:
  mssql-data:
