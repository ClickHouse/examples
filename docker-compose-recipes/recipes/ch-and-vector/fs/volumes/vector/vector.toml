# Each source repeats one fixed fixture three times, then stops.
[sources.src_syslog]
type = "demo_logs"
format = "shuffle"
count = 3
interval = 0.1
lines = ['<14>1 2026-09-06T12:00:00Z demo-host demo-app 123 demo-id - hello-vector']

[sources.src_apache_http_json]
type = "demo_logs"
format = "shuffle"
count = 3
interval = 0.1
lines = ['{"datetime":"06/Sep/2026:12:00:00 +0000","host":"127.0.0.1","method":"GET","protocol":"HTTP/1.1","referer":"-","request":"/example","status":"200","bytes":128,"user-identifier":"demo"}']

[transforms.parse_syslog]
type = "remap"
inputs = ["src_syslog"]
source = '''
parsed = parse_syslog!(.message)
. = {
  "appname": to_string!(parsed.appname),
  "facility": to_string!(parsed.facility),
  "hostname": to_string!(parsed.hostname),
  "message": to_string!(parsed.message),
  "msgid": to_string!(parsed.msgid),
  "procid": to_int!(parsed.procid),
  "severity": to_string!(parsed.severity),
  "source_type": "demo_logs",
  "timestamp": format_timestamp!(parsed.timestamp, format: "%Y-%m-%dT%H:%M:%SZ"),
  "version": to_int!(parsed.version)
}
'''

[transforms.parse_apache_http_json]
type = "remap"
inputs = ["src_apache_http_json"]
source = '''
. = parse_json!(.message)
.bytes = to_int!(.bytes)
.status = to_string!(.status)
'''

[sinks.clickhouse_syslog]
type = "clickhouse"
inputs = ["parse_syslog"]
endpoint = "http://clickhouse:8123"
database = "default"
table = "syslog_raw_data"
skip_unknown_fields = false
batch.timeout_secs = 1
auth.strategy = "basic"
auth.user = "demo"
auth.password = "local-example-password"

[sinks.clickhouse_apache]
type = "clickhouse"
inputs = ["parse_apache_http_json"]
endpoint = "http://clickhouse:8123"
database = "default"
table = "apache_raw_data"
skip_unknown_fields = false
batch.timeout_secs = 1
auth.strategy = "basic"
auth.user = "demo"
auth.password = "local-example-password"

# Retain Vector's default retry policy; do not disable transient-error retries.
