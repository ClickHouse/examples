services:
  clickhouse:
    image: clickhouse/clickhouse-server:${CHVER:-latest}
    environment:
      CLICKHOUSE_USER: demo
      CLICKHOUSE_PASSWORD: local-example-password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./fs/volumes/clickhouse/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "127.0.0.1:18123:8123"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "demo", "--password", "local-example-password", "--query", "SELECT count() FROM syslog_raw_data UNION ALL SELECT count() FROM apache_raw_data"]
      interval: 2s
      timeout: 5s
      retries: 30

  vector:
    image: timberio/vector:0.58.0-alpine
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      - ./fs/volumes/vector/vector.toml:/etc/vector/vector.toml:ro
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  clickhouse-data:
