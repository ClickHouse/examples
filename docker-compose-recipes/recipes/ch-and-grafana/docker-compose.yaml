services:
  clickhouse:
    image: clickhouse/clickhouse-server:${CHVER:-latest}
    environment:
      CLICKHOUSE_USER: demo
      CLICKHOUSE_PASSWORD: local-example-password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:18123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "grafana_reader", "--password", "local-reader-password", "--query", "SELECT count() FROM default.events"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  grafana:
    image: grafana/grafana:13.2.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: local-grafana-password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.21.2
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      clickhouse:
        condition: service_healthy

  verify:
    profiles: [tools]
    image: python:3.12-alpine
    command: ["python", "/verify.py"]
    volumes:
      - ./verify.py:/verify.py:ro

volumes:
  clickhouse-data:
  grafana-data:
