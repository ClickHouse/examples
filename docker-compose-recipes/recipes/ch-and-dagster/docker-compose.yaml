services:
  clickhouse:
    image: clickhouse/clickhouse-server:${CHVER:-latest}
    environment:
      CLICKHOUSE_USER: demo
      CLICKHOUSE_PASSWORD: local-example-password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:18123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "demo", "--password", "local-example-password", "--query", "SELECT 1"]
      interval: 2s
      timeout: 5s
      retries: 30

  dagster_webserver:
    build:
      context: .
      dockerfile: dagster/Dockerfile
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_USER: demo
      CLICKHOUSE_PASSWORD: local-example-password
      CLICKHOUSE_SECURE: "false"
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      - ./user_code:/opt/dagster/app/user_code:ro
      - dagster-data:/opt/dagster/dagster_home
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  clickhouse-data:
  dagster-data:
