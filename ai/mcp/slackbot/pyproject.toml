    "pydantic-ai-slim[mcp,anthropic,openai]==2.40.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.3",
    "slack-bolt==1.30.0",
    "vl-convert-python==1.9.0.post1",
]
