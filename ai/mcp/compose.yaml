services:
  mcp-clickhouse:
    image: ghcr.io/clickhouse/mcp-clickhouse:0.6.0
    ports:
      - "127.0.0.1:${MCP_PORT:-8001}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-sql-clickhouse.clickhouse.com}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8443}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-demo}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_SECURE: ${CLICKHOUSE_SECURE:-true}
      CLICKHOUSE_MCP_SERVER_TRANSPORT: http
      CLICKHOUSE_MCP_BIND_HOST: 0.0.0.0
      CLICKHOUSE_MCP_BIND_PORT: "8000"
      CLICKHOUSE_MCP_AUTH_TOKEN: ${CLICKHOUSE_MCP_AUTH_TOKEN:?Set a random MCP token in .env}
      CLICKHOUSE_MCP_ALLOWED_HOSTS: mcp-clickhouse:8000,localhost:${MCP_PORT:-8001},127.0.0.1:${MCP_PORT:-8001}
