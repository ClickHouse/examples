version: 1.3.13
cache: true
interface:
  mcpServers:
    use: true
    create: false
    share: false
    configure: false
mcpSettings:
  allowedDomains:
    - http://mcp-clickhouse:8000
mcpServers:
  clickhouse:
    type: streamable-http
    url: http://mcp-clickhouse:8000/mcp
    headers:
      Authorization: "Bearer ${CLICKHOUSE_MCP_AUTH_TOKEN}"
    requiresOAuth: false
    timeout: 60000
    initTimeout: 60000
