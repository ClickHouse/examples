name: Shipment Tracker checks

on:
  pull_request:
    paths:
      - 'applications/shipment-tracker/**'
      - '.github/workflows/shipment-tracker.yml'
  push:
    branches: [main]
    paths:
      - 'applications/shipment-tracker/**'
      - '.github/workflows/shipment-tracker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: applications/shipment-tracker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: applications/shipment-tracker/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

# Cloud mutation/CDC acceptance is a separate explicit fixture run; see the README.
