name: Capacity Board checks

on:
  pull_request:
    paths:
      - 'applications/capacity-board/**'
      - '.github/workflows/capacity-board.yml'
  push:
    branches: [main]
    paths:
      - 'applications/capacity-board/**'
      - '.github/workflows/capacity-board.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: applications/capacity-board
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.401'
      - name: Locked native checks
        run: |
          dotnet restore --locked-mode
          dotnet restore Tests/Tests.csproj --locked-mode
          dotnet format --verify-no-changes --no-restore
          dotnet format Tests/Tests.csproj --verify-no-changes --no-restore
          dotnet build -c Release --no-restore
          dotnet run --project Tests/Tests.csproj -c Release --no-restore
          dotnet publish -c Release --no-restore -o /tmp/capacity-published
          python3 test/preflight.py /tmp/capacity-published/CapacityBoard
# Real Cloud/browser acceptance is explicit and uses no Cloud secrets in CI.
