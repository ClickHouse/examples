name: Usage meter checks
on:
  pull_request:
    paths: ['applications/usage-meter/**', '.github/workflows/usage-meter.yml']
  push:
    branches: [main]
    paths: ['applications/usage-meter/**', '.github/workflows/usage-meter.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/usage-meter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew --no-daemon clean test installDist
# Real Cloud acceptance is explicit and does not use CI credentials.
