name: Incident room
on:
  push:
    branches: [main]
    paths: ['applications/incident-room/**', '.github/workflows/incident-room.yml']
  pull_request:
    paths: ['applications/incident-room/**', '.github/workflows/incident-room.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: applications/incident-room
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '28.5.0.7'
          elixir-version: '1.20.4'
      - run: mix deps.get --check-locked
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix assets.build
      - run: mix test
