name: Experiment log
on:
  push:
    paths: ['applications/experiment-log/**', '.github/workflows/experiment-log.yml']
  pull_request:
    paths: ['applications/experiment-log/**', '.github/workflows/experiment-log.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/experiment-log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: scripts/sbtw clean scalafmtCheckAll compile test verifyDependencyLock
