name: Durable Imports checks

on:
  pull_request:
    paths:
      - 'applications/durable-imports/**'
      - '.github/workflows/durable-imports.yml'
  push:
    branches: [main]
    paths:
      - 'applications/durable-imports/**'
      - '.github/workflows/durable-imports.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/durable-imports
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: applications/durable-imports/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run build
      - run: npm test

# Cloud recovery tests require an explicitly provisioned dedicated fixture.
