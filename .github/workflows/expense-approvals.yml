name: Expense approvals checks

on:
  pull_request:
    paths:
      - 'applications/expense-approvals/**'
      - '.github/workflows/expense-approvals.yml'
  push:
    branches: [main]
    paths:
      - 'applications/expense-approvals/**'
      - '.github/workflows/expense-approvals.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: applications/expense-approvals
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: ./mvnw -B verify
# Cloud acceptance is explicit and requires a disposable service; no Cloud secrets in CI.
