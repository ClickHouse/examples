name: Habit Tracker checks

on:
  pull_request:
    paths:
      - 'applications/habit-tracker/**'
      - '.github/workflows/habit-tracker.yml'
  push:
    branches: [main]
    paths:
      - 'applications/habit-tracker/**'
      - '.github/workflows/habit-tracker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/habit-tracker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: applications/habit-tracker/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build

# Integration tests need a Postgres database; see the README.
