name: Playlist API
on:
  push:
    paths: ['applications/playlist-api/**', '.github/workflows/playlist-api.yml']
  pull_request:
    paths: ['applications/playlist-api/**', '.github/workflows/playlist-api.yml']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: applications/playlist-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: applications/playlist-api/go.sum
      - run: go mod download && go mod verify
      - run: test -z "$(gofmt -l cmd internal graph ent *.go)"
      - run: go test -v -count=1 ./...
      - run: python3 scripts/check-generation.py
      - run: go build ./cmd/server
