name: Expense review build
on:
  pull_request:
    paths:
      - 'applications/expense-review/**'
      - '.github/workflows/expense-review.yml'
  push:
    paths:
      - 'applications/expense-review/**'
      - '.github/workflows/expense-review.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/expense-review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: applications/expense-review/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
