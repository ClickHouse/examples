name: Semantic notes
on:
  push:
    paths: ['applications/semantic-notes/**', '.github/workflows/semantic-notes.yml']
  pull_request:
    paths: ['applications/semantic-notes/**', '.github/workflows/semantic-notes.yml']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: applications/semantic-notes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            applications/semantic-notes/requirements.txt
            applications/semantic-notes/requirements-dev.txt
      - run: pip install -r requirements-dev.txt && pip check
      - run: ruff check semantic_notes scripts tests migrations
      - run: ruff format --check semantic_notes scripts tests migrations
      - run: python -m unittest discover -s tests -v
