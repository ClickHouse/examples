name: Service topology
on:
  pull_request:
    paths:
      - 'applications/service-topology/**'
      - '.github/workflows/service-topology.yml'
  push:
    paths:
      - 'applications/service-topology/**'
      - '.github/workflows/service-topology.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/service-topology
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun test tests/graph.test.ts
      - run: bun run build
