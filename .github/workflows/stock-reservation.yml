name: Stock Reservation checks

on:
  pull_request:
    paths:
      - 'applications/stock-reservation/**'
      - '.github/workflows/stock-reservation.yml'
  push:
    branches: [main]
    paths:
      - 'applications/stock-reservation/**'
      - '.github/workflows/stock-reservation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: applications/stock-reservation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run test:unit

# Managed Postgres integration tests are an explicit run with dedicated fixtures.
# See applications/stock-reservation/docs/verification.md for recorded Cloud tests.
