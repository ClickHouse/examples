name: CSV review desk
on:
  push:
    paths:
      - 'applications/csv-review-desk/**'
      - '.github/workflows/csv-review-desk.yml'
  pull_request:
    paths:
      - 'applications/csv-review-desk/**'
      - '.github/workflows/csv-review-desk.yml'
permissions:
  contents: read
jobs:
  python-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/csv-review-desk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: applications/csv-review-desk/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m compileall -q app.py reviewdesk migrations tests
      - run: ruff check .
      - run: ruff format --check .
