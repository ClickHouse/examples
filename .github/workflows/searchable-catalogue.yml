name: Searchable catalogue
on:
  push:
    paths: ['applications/searchable-catalogue/**', '.github/workflows/searchable-catalogue.yml']
  pull_request:
    paths: ['applications/searchable-catalogue/**', '.github/workflows/searchable-catalogue.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/searchable-catalogue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: applications/searchable-catalogue/package-lock.json
      - run: npm ci
      - run: npm run build
