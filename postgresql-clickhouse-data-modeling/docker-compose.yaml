# Supporting versions follow PeerDB's official OSS Compose stack.
x-catalog: &catalog
  PEERDB_CATALOG_HOST: catalog
  PEERDB_CATALOG_PORT: 5432
  PEERDB_CATALOG_USER: postgres
  PEERDB_CATALOG_PASSWORD: postgres
  PEERDB_CATALOG_DATABASE: postgres

x-stage: &stage
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_ACCESS_KEY_ID: _peerdb_minioadmin
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_SECRET_ACCESS_KEY: _peerdb_minioadmin
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_REGION: us-east-1
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_ENDPOINT_URL_S3: http://minio:9000
  PEERDB_CLICKHOUSE_AWS_S3_BUCKET_NAME: peerdbbucket

x-flow: &flow
  <<: [*catalog, *stage]
  TEMPORAL_HOST_PORT: temporal:7233
  PEERDB_TEMPORAL_NAMESPACE: default

x-flow-dependencies: &flow-dependencies
  temporal-admin-tools:
    condition: service_completed_successfully
  minio-init:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: clickhouse_pg_db
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - source-data:/var/lib/postgresql/data
      - ./volumes/postgres/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U admin -d clickhouse_pg_db"]
      interval: 2s
      timeout: 5s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:${CHVER:-latest}
    environment:
      CLICKHOUSE_USER: demo
      CLICKHOUSE_PASSWORD: local-example-password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:18123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  catalog:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    command: -c config_file=/etc/postgresql.conf
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --locale=C.UTF-8
    volumes:
      - catalog-data:/var/lib/postgresql
      - ./volumes/catalog/postgresql.conf:/etc/postgresql.conf:ro
      - ./volumes/catalog/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-d", "postgres", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  temporal:
    image: temporalio/auto-setup:1.29@sha256:f14912b699cf73015ad5c4fc18d522d4b014db90e794039214dfb7c022c2644f
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: catalog
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ./volumes/temporal-dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    depends_on:
      catalog:
        condition: service_healthy

  temporal-admin-tools:
    image: temporalio/admin-tools:1.25.2-tctl-1.18.1-cli-1.1.1@sha256:da0c7a7982b571857173ab8f058e7f139b3054800abb4dcb100445d29a563ee8
    entrypoint: ["/bin/sh", "/setup.sh"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    volumes:
      - ./scripts/mirror-name-search.sh:/setup.sh:ro
    depends_on:
      - temporal

  minio:
    # Retained from PeerDB OSS: an internal transient stage, not a separate S3 lesson.
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: _peerdb_minioadmin
      MINIO_ROOT_PASSWORD: _peerdb_minioadmin
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    entrypoint: ["/bin/sh", "/setup.sh"]
    environment:
      MINIO_ROOT_USER: _peerdb_minioadmin
      MINIO_ROOT_PASSWORD: _peerdb_minioadmin
    volumes:
      - ./scripts/minio-bucket.sh:/setup.sh:ro
    depends_on:
      - minio

  flow-api:
    image: ghcr.io/peerdb-io/flow-api:stable-v0.37.5
    environment:
      <<: *flow
    depends_on: *flow-dependencies

  flow-worker:
    image: ghcr.io/peerdb-io/flow-worker:stable-v0.37.5
    environment:
      <<: *flow
    depends_on: *flow-dependencies

  flow-snapshot-worker:
    image: ghcr.io/peerdb-io/flow-snapshot-worker:stable-v0.37.5
    environment:
      <<: *flow
    depends_on: *flow-dependencies

  peerdb:
    image: ghcr.io/peerdb-io/peerdb-server:stable-v0.37.5
    stop_signal: SIGINT
    environment:
      <<: *catalog
      PEERDB_PASSWORD: local-peerdb-password
      PEERDB_FLOW_SERVER_ADDRESS: grpc://flow-api:8112
      RUST_LOG: info
    depends_on:
      catalog:
        condition: service_healthy

  peerdb-ui:
    profiles: [ui]
    image: ghcr.io/peerdb-io/peerdb-ui:stable-v0.37.5
    environment:
      <<: *catalog
      PEERDB_FLOW_SERVER_HTTP: http://flow-api:8113
      NEXTAUTH_SECRET: local-example-nextauth-secret
      NEXTAUTH_URL: http://localhost:13000
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      - flow-api

  temporal-ui:
    profiles: [ui]
    image: temporalio/ui:2.53.3@sha256:eef301146e60fad34b47adaecfae4149016e34b2d44ba94fca5fd8e5441f182a
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:13000
      TEMPORAL_CSRF_COOKIE_INSECURE: "true"
    ports:
      - "127.0.0.1:18085:8080"
    depends_on:
      - temporal

  bootstrap:
    profiles: [tools]
    image: python:3.12-alpine
    command: ["python", "/app/bootstrap.py"]
    environment:
      PEERDB_API: http://flow-api:8113
    volumes:
      - ./scripts/bootstrap.py:/app/bootstrap.py:ro

  loader:
    profiles: [tools]
    build: .
    command: ["python", "python/import_parquet.py", "clickhouse_pg_db", "admin", "password", "postgres", "5432", "100000"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - dataset-cache:/app/data

volumes:
  source-data:
  clickhouse-data:
  catalog-data:
  minio-data:
  dataset-cache:
